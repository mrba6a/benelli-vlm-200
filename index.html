<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Garage 3D - الجراج الذكي التفاعلي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&family=Orbitron:wght@600;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            font-family: 'Readex Pro', system-ui, -apple-system, sans-serif;
            color: #f8fafc; background: #07090e;
        }
        #canvas-container { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 1; }
        canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
        canvas:active { cursor: grabbing; }
        .lcd-font { font-family: 'Share Tech Mono', 'Orbitron', monospace; }

        /* Splash Screen (شاشة البداية) */
        #splash-screen {
            position: fixed; inset: 0; z-index: 100;
            background: radial-gradient(circle at 50% 45%, #181d2a 0%, #080a0f 80%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.8s ease;
        }
        .splash-logo {
            width: 140px; height: 140px; border-radius: 32px;
            background: url('https://raw.githubusercontent.com/mrba6a/benelli-vlm-200/main/logo.png') no-repeat center/cover, #141722;
            border: 2px solid #f97316;
            box-shadow: 0 0 30px rgba(249, 115, 22, 0.4);
            margin-bottom: 24px;
        }

        .orb-btn {
            width: 44px; height: 44px; border-radius: 9999px;
            background: rgba(13, 17, 26, 0.88);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1.5px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.65);
            display: flex; align-items: center; justify-content: center;
            color: #e2e8f0; cursor: pointer;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
        }
        .orb-btn:active { transform: scale(0.92); }
        .orb-btn.active-power {
            background: radial-gradient(circle, #f97316 0%, #7c2d12 100%);
            border-color: #fdba74; color: #fff; box-shadow: 0 0 22px rgba(249, 115, 22, 0.7);
        }
        .orb-label {
            position: absolute; bottom: -15px; left: 50%; transform: translateX(-50%);
            font-size: 9px; font-weight: 600; white-space: nowrap; color: #cbd5e1;
            text-shadow: 0 2px 4px rgba(0,0,0,0.95); pointer-events: none;
        }
        .glass-card {
            background: rgba(12, 16, 25, 0.93);
            backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(249, 115, 22, 0.28);
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.85);
        }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(249, 115, 22, 0.5); border-radius: 99px; }
    </style>
</head>
<body>

    <!-- Splash Screen -->
    <div id="splash-screen">
        <div class="splash-logo animate-pulse"></div>
        <h1 class="text-xl font-bold text-orange-500 tracking-wider mb-1">GARAGE 3D</h1>
        <p class="text-xs text-gray-400 mb-6">جاري تشغيل جراجك الذكي...</p>
        <div class="w-32 h-1 bg-gray-800 rounded-full overflow-hidden">
            <div class="h-full bg-orange-500 rounded-full animate-[loading_2s_ease-out_forwards]" style="width: 0%"></div>
        </div>
    </div>

    <!-- 3D Viewport -->
    <div id="canvas-container"></div>

    <!-- Mobile-Optimized Top Bar -->
    <div class="fixed top-2 left-1/2 -translate-x-1/2 z-20 w-[94%] max-w-lg pointer-events-none">
        <div class="glass-card px-3 py-1.5 rounded-2xl flex items-center justify-between border border-orange-500/30 shadow-xl pointer-events-auto">
            <div class="flex items-center gap-2">
                <span id="engine-led-dot" class="w-2.5 h-2.5 rounded-full bg-zinc-500 transition-all duration-300 animate-pulse"></span>
                <span id="top-bike-name" class="text-xs font-bold text-white">BENELLI <span class="text-orange-500">VLM 200</span></span>
            </div>
            <span id="top-plate-id" class="text-[9.5px] bg-orange-500/20 text-orange-400 border border-orange-500/40 px-2.5 py-0.5 rounded-full font-semibold">ك م ى ٦٧٢٨</span>
            <div class="flex items-center gap-2">
                <div class="bg-black/50 px-2 py-0.5 rounded-lg border border-white/10 text-[9.5px] text-orange-400 font-bold lcd-font">
                    <span id="top-odo-readout">014800</span> كم
                </div>
                <button onclick="window.toggleSetupPanel()" class="w-6 h-6 rounded-lg bg-white/5 hover:bg-orange-500/20 border border-white/10 flex items-center justify-center text-xs">⚙️</button>
            </div>
        </div>
    </div>

    <!-- Setup Options Panel (تخصيص البيانات) -->
    <div id="setup-panel" class="hidden fixed inset-x-4 top-14 z-30 max-w-sm mx-auto glass-card p-4 rounded-2xl border border-orange-500/40 text-xs text-gray-300">
        <div class="flex items-center justify-between border-b border-white/10 pb-2 mb-3">
            <span class="font-bold text-orange-500">⚙️ إعدادات جراجك الخاص</span>
            <button onclick="window.toggleSetupPanel(false)" class="text-gray-400 hover:text-white">✕</button>
        </div>
        <div class="space-y-2.5">
            <div>
                <label class="block mb-1 text-[10px] text-gray-400">اسم المركبة:</label>
                <input id="setup-name" type="text" value="Benelli VLM 200" oninput="window.updateVehicleConfig()" class="w-full bg-black/60 border border-white/10 rounded-lg p-1.5 text-white outline-none">
            </div>
            <div>
                <label class="block mb-1 text-[10px] text-gray-400">رقم اللوحة:</label>
                <input id="setup-plate" type="text" value="ك م ى ٦٧٢٨" oninput="window.updateVehicleConfig()" class="w-full bg-black/60 border border-white/10 rounded-lg p-1.5 text-white outline-none">
            </div>
            <div>
                <label class="block mb-1 text-[10px] text-gray-400">قراءة العداد (كم):</label>
                <input id="setup-odo" type="number" value="14800" oninput="window.updateVehicleConfig()" class="w-full bg-black/60 border border-white/10 rounded-lg p-1.5 text-white outline-none">
            </div>
            <button onclick="window.toggleSetupPanel(false)" class="w-full py-1.5 mt-1 bg-orange-500 text-black font-bold rounded-lg transition hover:brightness-110">حفظ وتحديث 🔒</button>
        </div>
    </div>

    <!-- Compact Floating Left Sidebar (تحكمات الموتوسيكل) -->
    <aside class="fixed left-2 top-1/2 -translate-y-1/2 z-20 flex flex-col gap-5 pointer-events-auto">
        <button id="btn-power" onclick="window.toggleEnginePower()" class="orb-btn" title="تشغيل / إيقاف">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.77.04"/></svg>
            <span class="orb-label">باور</span>
        </button>
        <button id="btn-lights" onclick="window.toggleLights()" class="orb-btn" title="الكشاف">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M11 4C6.5 4 3 7.5 3 12s3.5 8 8 8c1.5 0 2.5-1 2.5-2.5V6.5C13.5 5 12.5 4 11 4z"/><path d="M16 7l5-2"/><path d="M16 12h6"/><path d="M16 17l5 2"/></svg>
            <span class="orb-label">النور</span>
        </button>
        <button id="btn-horn" onmousedown="window.triggerHorn(event)" onmouseup="window.releaseHorn()" ontouchstart="window.triggerHorn(event)" ontouchend="window.releaseHorn()" class="orb-btn" title="كلاكس">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 11v2a1 1 0 0 0 1 1h3l5 4V6L7 10H4a1 1 0 0 0-1 1z"/><path d="M16 8.5a4.5 4.5 0 0 1 0 7"/></svg>
            <span class="orb-label">كلاكس</span>
        </button>
        <button id="btn-rev" onmousedown="window.triggerRev(event)" onmouseup="window.releaseRev()" ontouchstart="window.triggerRev(event)" ontouchend="window.releaseRev()" class="orb-btn" title="بنزين">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
            <span class="orb-label">بنزين</span>
        </button>
        <button id="btn-box" onclick="window.toggleTopBox()" class="orb-btn" title="فتح البوكس الخلفي">
            <span>📦</span>
            <span id="box-label" class="orb-label">افتح البوكس</span>
        </button>
    </aside>

    <!-- Compact Floating Right Sidebar (تحكمات الراكب) -->
    <aside class="fixed right-2 top-1/2 -translate-y-1/2 z-20 flex flex-col gap-5 pointer-events-auto">
        <button id="btn-mount" onclick="window.toggleRiderPose()" class="orb-btn active-power" title="الوضع الافتراضي">
            <span>🧍</span>
            <span id="mount-lbl" class="orb-label">واقف جنبه</span>
        </button>
        <div class="flex flex-col items-center gap-1">
            <button onclick="window.turnHandlebar('left')" class="orb-btn !w-9 !h-9">◀</button>
            <span class="text-[8px] text-orange-400 font-bold">الجادون</span>
            <button onclick="window.turnHandlebar('right')" class="orb-btn !w-9 !h-9">▶</button>
        </div>
        <div class="flex flex-col items-center gap-1">
            <button onclick="window.testWheelSpin()" class="orb-btn !w-9 !h-9">🔄</button>
            <span class="text-[8px] text-orange-400 font-bold">العجل</span>
        </div>
    </aside>

    <!-- PWA Bottom Floating Bar -->
    <div class="fixed bottom-3 left-1/2 -translate-x-1/2 z-20 pointer-events-auto">
        <div class="glass-card px-3 py-1.5 rounded-full flex items-center gap-4 border border-orange-500/20 shadow-lg">
            <button class="flex flex-col items-center text-[10px] text-gray-400 hover:text-orange-500"><span>⛽</span>البنزين</button>
            <button class="flex flex-col items-center text-[10px] text-gray-400 hover:text-orange-500"><span>🛠️</span>الصيانة</button>
            <button class="flex flex-col items-center text-[10px] text-gray-400 hover:text-orange-500"><span>📊</span>التقارير</button>
        </div>
    </div>

    <!-- Three.js Visual & Kinematics Engines -->
    <script>
        setTimeout(() => {
            const splash = document.getElementById('splash-screen');
            if (splash) {
                splash.style.opacity = 0;
                setTimeout(() => splash.remove(), 800);
            }
        }, 2200);

        let scene, camera, renderer, motorcycleGroup, steeringGroup, wheelFront, wheelRear, boxCoverGroup;
        let riderGroup, riderArmRight, riderArmLeft;
        let isEngineOn = false, isRevving = false, isHornPressed = false;
        let targetHandlebarY = 0, currentHandlebarY = 0;
        let isPillionMounted = false; // الوضع الافتراضي: واقف
        let isTopBoxOpen = false;

        function init() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0e1118);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 2.5, 4.5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.8));
            const light = new THREE.DirectionalLight(0xfff3c4, 1.5);
            light.position.set(5, 10, 5);
            scene.add(light);

            // Platform
            const ground = new THREE.Mesh(
                new THREE.CylinderGeometry(2, 2.05, 0.1, 64),
                new THREE.MeshStandardMaterial({ color: 0x1c1e24, roughness: 0.5 })
            );
            ground.position.y = -0.05;
            scene.add(ground);

            // Group for all motorcycle components
            motorcycleGroup = new THREE.Group();
            scene.add(motorcycleGroup);

            // Build Basic Custom Bike Model with Steering assembly
            const chassis = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.4, 1.6), new THREE.MeshStandardMaterial({ color: 0x08090f }));
            chassis.position.y = 0.5;
            motorcycleGroup.add(chassis);

            // Wheels
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.8 });
            wheelFront = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.15, 32), wheelMat);
            wheelFront.rotation.z = Math.PI / 2;
            
            wheelRear = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.15, 32), wheelMat);
            wheelRear.rotation.z = Math.PI / 2;
            wheelRear.position.set(0, 0.3, -0.6);
            motorcycleGroup.add(wheelRear);

            // Front steering setup
            steeringGroup = new THREE.Group();
            steeringGroup.position.set(0, 0.7, 0.6);
            
            const forks = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.8, 16), new THREE.MeshStandardMaterial({ color: 0xd97706, metalness: 0.8 }));
            forks.position.y = -0.2;
            steeringGroup.add(forks);

            const handlebar = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.8, 16), new THREE.MeshStandardMaterial({ color: 0x111 }));
            handlebar.rotation.x = Math.PI / 2;
            handlebar.position.set(0, 0.25, 0);
            steeringGroup.add(handlebar);

            wheelFront.position.set(0, -0.4, 0);
            steeringGroup.add(wheelFront);

            motorcycleGroup.add(steeringGroup);

            // Box Group & Animation Setup
            const boxBase = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.2, 0.4), new THREE.MeshStandardMaterial({ color: 0x111 }));
            boxBase.position.set(0, 0.8, -0.7);
            motorcycleGroup.add(boxBase);

            boxCoverGroup = new THREE.Group();
            boxCoverGroup.position.set(0, 0.9, -0.5); // Hinge joint on front edge
            const cover = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.1, 0.4), new THREE.MeshStandardMaterial({ color: 0x222 }));
            cover.position.set(0, 0.05, -0.2); // Offset origin to hinge
            boxCoverGroup.add(cover);
            motorcycleGroup.add(boxCoverGroup);

            // Create customizable Rider model
            riderGroup = new THREE.Group();
            scene.add(riderGroup);

            const riderTorso = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.1, 0.5, 16), new THREE.MeshStandardMaterial({ color: 0x1a1a1a }));
            riderTorso.position.y = 0.85;
            riderGroup.add(riderTorso);

            const head = new THREE.Mesh(new THREE.SphereGeometry(0.08, 16, 16), new THREE.MeshStandardMaterial({ color: 0xd9a17c }));
            head.position.set(0, 1.15, 0);
            riderGroup.add(head);

            // Right forearm kinematics
            riderArmRight = new THREE.Group();
            riderArmRight.position.set(-0.15, 1.0, 0.05);
            const rArmMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.025, 0.35, 12), new THREE.MeshStandardMaterial({ color: 0x1a1a1a }));
            rArmMesh.position.y = -0.15;
            rArmMesh.rotation.z = -0.2;
            riderArmRight.add(rArmMesh);
            riderGroup.add(riderArmRight);

            // Left forearm kinematics
            riderArmLeft = new THREE.Group();
            riderArmLeft.position.set(0.15, 1.0, 0.05);
            const lArmMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.025, 0.35, 12), new THREE.MeshStandardMaterial({ color: 0x1a1a1a }));
            lArmMesh.position.y = -0.15;
            lArmMesh.rotation.z = 0.2;
            riderArmLeft.add(lArmMesh);
            riderGroup.add(riderArmLeft);

            setRiderPose('standing');
            animate();
        }

        window.toggleRiderPose = function() {
            isPillionMounted = !isPillionMounted;
            const btn = document.getElementById('btn-mount');
            const lbl = document.getElementById('mount-lbl');
            if (isPillionMounted) {
                btn.classList.add('active-power');
                lbl.innerText = "راكب عليه";
                setRiderPose('riding');
                // Suspension sag animation: bike dips slightly when weight goes on
                motorcycleGroup.position.y = -0.04;
            } else {
                btn.classList.remove('active-power');
                lbl.innerText = "واقف جنبه";
                setRiderPose('standing');
                motorcycleGroup.position.y = 0;
            }
        };

        function setRiderPose(pose) {
            if (pose === 'standing') {
                riderGroup.position.set(0.55, 0, 0.1);
                riderGroup.rotation.set(0, Math.PI / 1.6, 0);
                riderArmRight.rotation.set(-0.5, 0, 0.2);
                riderArmLeft.rotation.set(0.2, 0, -0.2);
            } else if (pose === 'riding') {
                riderGroup.position.set(0, 0.15, -0.08);
                riderGroup.rotation.set(0, 0, 0);
                riderArmRight.rotation.set(-0.8, -0.4, -0.3); // Mounted on bar/throttle
                riderArmLeft.rotation.set(-0.8, 0.4, 0.3); // Mounted on left bar
            }
        }

        window.turnHandlebar = function(dir) {
            if (dir === 'left') targetHandlebarY = 0.35;
            else if (dir === 'right') targetHandlebarY = -0.35;
            else targetHandlebarY = 0;
            
            // Auto reset
            setTimeout(() => { targetHandlebarY = 0; }, 750);
        };

        window.testWheelSpin = function() {
            // Apply visual wheel spin testing
            wheelFront.rotation.x += 1.5;
            wheelRear.rotation.x += 1.5;
        };

        window.toggleEnginePower = function() {
            isEngineOn = !isEngineOn;
            const btn = document.getElementById('btn-power');
            const dot = document.getElementById('engine-led-dot');
            if (isEngineOn) {
                btn.classList.add('active-power');
                dot.style.background = "#f97316";
            } else {
                btn.classList.remove('active-power');
                dot.style.background = "#a1a1aa";
            }
        };

        window.triggerHorn = function(e) {
            if (e && e.cancelable) e.preventDefault();
            isHornPressed = true;
            document.getElementById('btn-horn').classList.add('active-power');
            if (isPillionMounted) {
                riderArmLeft.rotation.set(-1.0, 0.1, -0.2); // Hand moves inward towards console
            }
        };

        window.releaseHorn = function() {
            isHornPressed = false;
            document.getElementById('btn-horn').classList.remove('active-power');
            if (isPillionMounted) setRiderPose('riding');
        };

        window.triggerRev = function(e) {
            if (e && e.cancelable) e.preventDefault();
            isRevving = true;
            document.getElementById('btn-rev').classList.add('active-power');
            if (isPillionMounted) {
                riderArmRight.rotation.x = -1.1; // Forearm dips slightly forward
            }
        };

        window.releaseRev = function() {
            isRevving = false;
            document.getElementById('btn-rev').classList.remove('active-power');
            if (isPillionMounted) setRiderPose('riding');
        };

        window.toggleTopBox = function() {
            isTopBoxOpen = !isTopBoxOpen;
            const btn = document.getElementById('btn-box');
            const lbl = document.getElementById('box-label');
            if (isTopBoxOpen) {
                btn.classList.add('active-power');
                lbl.innerText = "البوكس مفتوح";
            } else {
                btn.classList.remove('active-power');
                lbl.innerText = "افتح البوكس";
            }
        };

        window.toggleSetupPanel = function(show) {
            const panel = document.getElementById('setup-panel');
            if (show === false) panel.classList.add('hidden');
            else panel.classList.toggle('hidden');
        };

        window.updateVehicleConfig = function() {
            const name = document.getElementById('setup-name').value;
            const plate = document.getElementById('setup-plate').value;
            const odo = document.getElementById('setup-odo').value;

            document.getElementById('top-bike-name').innerHTML = name;
            document.getElementById('top-plate-id').innerHTML = plate;
            document.getElementById('top-odo-readout').innerHTML = odo;
        };

        window.toggleLights = function() {
            document.getElementById('btn-lights').classList.toggle('active-power');
        };

        function animate() {
            requestAnimationFrame(animate);
            
            // Handlebar Interpolation (Steering Axis & Front Wheel Y Rotation)
            currentHandlebarY += (targetHandlebarY - currentHandlebarY) * 0.12;
            steeringGroup.rotation.y = currentHandlebarY;

            // Box hinge animation 0-90deg open limit
            const targetRot = isTopBoxOpen ? -Math.PI / 2 : 0;
            boxCoverGroup.rotation.x += (targetRot - boxCoverGroup.rotation.x) * 0.14;

            if (isRevving || isEngineOn) {
                // High frequency mini engine vibration idle effects
                motorcycleGroup.position.y += Math.sin(Date.now() * 0.08) * 0.0015;
            }

            // Global 3D turntable spin rotation
            scene.rotation.y += 0.0018;

            renderer.render(scene, camera);
        }

        window.onload = init;
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
